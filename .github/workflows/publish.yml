# Publica no npm quando uma release é criada no GitHub (o Zenodo gera o DOI pela mesma release).
# Requer o segredo NPM_TOKEN (token "Automation" do npm) em Settings → Secrets and variables → Actions.
name: Publicar no npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
