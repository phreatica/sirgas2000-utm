# Publica no npm quando uma release é criada no GitHub (o Zenodo gera o DOI pela mesma release).
# Autenticação: Trusted Publishing (OIDC) configurado no npmjs.com para este repositório e este arquivo.
# Não há token: o npm confia na identidade do GitHub Actions (permissão id-token abaixo).
name: Publicar no npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # Trusted Publishing e selo de procedência
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing exige npm >= 11.5.1 (o Node 22 vem com npm 10)
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --provenance --access public
